name: Build tfx-bsl

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build Wheels
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build: ["cp310", "cp311", "cp312", "cp313"]
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Build wheels
      uses: pypa/cibuildwheel@1b198eb0fd40daf384929579c8a9eafdcc4a41cc # v2.23.3
      env:
        CIBW_BUILD: ${{ matrix.build }}-*

    - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ matrix.build }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl

  upload_to_pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    if: (github.event_name == 'release' && startsWith(github.ref, 'refs/tags')) || (github.event_name == 'workflow_dispatch')
    needs: [build_wheels]
    environment:
      name: pypi
      url: https://pypi.org/p/tfx-bsl/
    permissions:
      contents: read
    steps:
      - name: Retrieve wheels and sdist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          merge-multiple: true
          path: wheels/

      - name: List the build artifacts
        run: |
          ls -lAs wheels/
      - name: Upload to PyPI
        # zizmor: ignore[use-trusted-publishing]
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: wheels/
          # already checked, and the pkginfo/twine versions on this runner causes check to fail
          verify-metadata: true
          verbose: true
